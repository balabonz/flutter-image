name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - versions.env
      - sdk/**
      - .github/workflows/build-push.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load versions
        run: |
          # shellcheck disable=SC1091
          source versions.env
          echo "ANDROID_SDK_VERSION=${ANDROID_SDK_VERSION}" >> "$GITHUB_ENV"

          if [ "${{ matrix.channel }}" = "stable" ]; then
            echo "FLUTTER_VERSION=${FLUTTER_STABLE}" >> "$GITHUB_ENV"
          else
            echo "FLUTTER_VERSION=${FLUTTER_BETA}" >> "$GITHUB_ENV"
          fi

      - name: Set image tags
        run: |
          VERSION_TAG="${FLUTTER_VERSION//+/-}"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"

          TAGS="${{ env.REGISTRY }}/${{ github.repository_owner }}/flutter:${VERSION_TAG}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository_owner }}/flutter:${{ matrix.channel }}"

          if [ "${{ matrix.channel }}" = "stable" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository_owner }}/flutter:latest"
          fi

          echo "IMAGE_TAGS=${TAGS}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          build-args: |
            ANDROID_SDK_VERSION=${{ env.ANDROID_SDK_VERSION }}
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Flutter SDK with Android toolchain
            org.opencontainers.image.version=${{ env.FLUTTER_VERSION }}

      - name: Smoke test
        run: |
          docker pull "${{ env.REGISTRY }}/${{ github.repository_owner }}/flutter:${{ matrix.channel }}"
          docker run --rm \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/flutter:${{ matrix.channel }}" \
            flutter doctor -v
